<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoWatch AI V2</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><style>
:root{font-family:'IBM Plex Sans Arabic',Arial,sans-serif;color:#152b45;background:#f5f8fc}*{box-sizing:border-box}body{margin:0}.app{display:flex;min-height:100vh}aside{width:250px;background:#fff;border-inline-end:1px solid #e5edf5;padding:24px 15px;flex-shrink:0}.brand{font:700 24px Arial;color:#183c5d;padding:10px}.brand b{color:#0a83cf}.brand small{display:block;font:11px Arial;letter-spacing:2px;color:#8c9aaa;margin-top:9px}.nav{margin-top:40px}button{font:inherit;cursor:pointer}.nav button{display:block;width:100%;border:0;text-align:start;padding:13px 15px;background:transparent;border-radius:10px;color:#62758b;margin:3px 0}.nav button.active,.nav button:hover{background:#e9f4ff;color:#0877c0;font-weight:700}.demo{font-size:11px;color:#8c9aaa;margin:28px 12px}main{min-width:0;flex:1;padding:26px 30px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:27px;gap:10px}.eyebrow{font:700 11px Arial;letter-spacing:1.5px;color:#0e91d5}h1{font-size:26px;margin:8px 0}p{color:#7a8a9c;margin:7px 0;line-height:1.8}.pill,.btn{border:1px solid #dbe5ee;border-radius:10px;background:white;padding:10px 15px;color:#315b7b}.primary{background:#0c85d5;color:#fff;border-color:#0c85d5}.hero{background:linear-gradient(115deg,#e9f5ff,#fff);padding:32px;border:1px solid #dfeefb;border-radius:18px;margin-bottom:23px}.hero h1{font-size:27px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.card,.stat{background:#fff;border:1px solid #e5edf5;border-radius:14px;padding:17px;box-shadow:0 3px 16px #1b3b5910}.map{height:420px;border-radius:9px;overflow:hidden}.row{width:100%;border:0;border-bottom:1px solid #eef1f5;padding:13px 5px;background:#fff;text-align:start;display:flex;justify-content:space-between;gap:8px}.row:hover{background:#f0f8ff}.row small{display:block;color:#92a0ad}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.stat small{color:#899aab}.stat strong{display:block;font:700 30px Arial;margin-top:12px}.section{margin-top:22px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{padding:10px;border:1px solid #dbe5ee;border-radius:9px;background:white;font:inherit}.warning{background:#fff8e8;border:1px solid #f1e4b6;border-radius:9px;padding:14px;margin-top:18px;color:#856b32;font-size:13px}.compare{position:relative;height:330px;overflow:hidden;border-radius:12px;background:#a4c8b1}.scene{position:absolute;inset:0;background:linear-gradient(135deg,#c9d4b0 0 30%,#8aaf89 30% 58%,#d3c3a3 58%)}.scene.after{background:linear-gradient(135deg,#b8cfad 0 30%,#a0aba0 30% 58%,#d5c7b4 58%)}.building{position:absolute;top:32%;left:34%;width:30%;height:35%;background:#dfe8ed;transform:skewY(-8deg);box-shadow:10px 12px #87979d}.scene.before .building{width:13%;height:15%}.compare input{position:absolute;bottom:16px;left:10%;width:80%}.agent{position:fixed;bottom:20px;left:22px;background:white;border:1px solid #dbe5ee;box-shadow:0 8px 30px #1d3c5b22;border-radius:14px;padding:15px;width:min(330px,90vw);z-index:20}.agent.hidden{display:none}.agent input{width:100%;padding:11px;border:1px solid #dbe5ee;border-radius:8px}.agentlog{max-height:170px;overflow:auto;font-size:13px;line-height:1.7;margin:12px 0}.footer{font-size:11px;color:#96a6b5;margin-top:25px}@media(max-width:900px){aside{width:72px;padding:12px 5px}.brand{font-size:12px}.brand small,.nav button span,.demo{display:none}.nav button{text-align:center}main{padding:16px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){aside{width:55px}.hero{padding:18px}.map{height:340px}header{align-items:flex-start}h1{font-size:21px}}
 .brand{display:flex;align-items:center;gap:10px;padding:6px 8px;font:inherit}.brand-mark{width:43px;height:43px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(140deg,#1595d6,#0864a9);color:white;font-size:29px}.brand-name{font:700 19px Arial;direction:ltr;white-space:nowrap}.brand-name small{font:600 8px Arial;letter-spacing:1.5px;margin-top:6px}.sidebar-tag{font-size:11px;color:#8a9cae;padding:16px 9px 12px;border-bottom:1px solid #e8eef5;line-height:1.8}.nav{margin-top:18px}.nav button{position:relative;display:flex;align-items:center;gap:11px;font-size:13px;padding:13px 13px}.nav button.active:after{content:"";position:absolute;inset-inline-end:0;top:18%;height:64%;width:3px;background:#138bd4;border-radius:3px}.sidebar-bottom{margin-top:40px;padding:15px 9px;border-top:1px solid #e8eef5;color:#61788a;font-size:11px;line-height:1.8}.sidebar-bottom small{display:block;color:#9aa9b7;margin-top:5px}.status-dot{display:inline-block;width:7px;height:7px;background:#19b48d;border-radius:50%;margin-inline-end:7px}@media(max-width:900px){.sidebar-tag,.brand-name,.sidebar-bottom{display:none}.brand{justify-content:center}.brand-mark{width:42px;flex-shrink:0}.nav button{justify-content:center}} </style></head><body><div id="app"></div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>
const places=[['Abu Dhabi','أبوظبي','UAE','الإمارات',54.37,24.45,'construction',92],['Dubai','دبي','UAE','الإمارات',55.27,25.20,'expansion',87],['Sharjah','الشارقة','UAE','الإمارات',55.42,25.34,'demolition',79],['Al Ain','العين','UAE','الإمارات',55.80,24.13,'reconstruction',85],['Fujairah','الفجيرة','UAE','الإمارات',56.32,25.12,'construction',90],['Riyadh','الرياض','Saudi Arabia','السعودية',46.72,24.69,'expansion',83],['Doha','الدوحة','Qatar','قطر',51.53,25.28,'construction',88]];
let page='dashboard',lang='ar',selected=0,kind='all',map=null,agent=false;const ar=()=>lang==='ar';const name=i=>ar()?places[i][1]:places[i][0];const watched=()=>{try{return JSON.parse(localStorage.getItem('gw_watch')||'[]')}catch{return []}};const save=a=>localStorage.setItem('gw_watch',JSON.stringify(a));
const labels={dashboard:['لوحة التحكم','Dashboard'],discover:['اكتشاف التغيرات','Discover changes'],random:['اكتشاف عشوائي','Random discovery'],compare:['قبل وبعد','Before & after'],monitor:['مواقع المراقبة','Monitored sites'],datasets:['البيانات التجريبية','Experimental data'],training:['مختبر الذكاء الاصطناعي','AI training lab'],reports:['التقارير','Reports'],settings:['الإعدادات','Settings']};const tx=(a,b)=>ar()?a:b;const nav=(p)=>{page=p;render()};
function render(){document.documentElement.lang=lang;document.documentElement.dir=ar()?'rtl':'ltr';if(map){map.remove();map=null}const filtered=places.map((x,i)=>i).filter(i=>kind==='all'||places[i][6]===kind);
document.querySelector('#app').innerHTML='<div class="app"><aside><div class="brand"><span class="brand-mark">◎</span><span class="brand-name">GeoWatch <b>AI</b><small>INTELLIGENCE PLATFORM</small></span></div><div class="sidebar-tag" id="sidebarTag"></div><nav class="nav">'+Object.keys(labels).map((k,i)=>'<button class="'+(page===k?'active':'')+'" onclick="nav(\''+k+'\')">'+['▦','◎','⤨','◉','♧','▤','✧','▧','⚙'][i]+' <span>'+labels[k][ar()?0:1]+'</span></button>').join('')+'</nav><div class="sidebar-bottom"><span class="status-dot"></span>وضع تجريبي — بدون تسجيل دخول<small>لا يوجد اتصال بمعالجة الأقمار الصناعية أو التدريب بعد</small></div></aside><main><header><div><div class="eyebrow">GEOSPATIAL CHANGE INTELLIGENCE</div><strong>'+labels[page][ar()?0:1]+'</strong></div><div class="actions"><button class="pill" onclick="agent=!agent;document.querySelector(\'.agent\').classList.toggle(\'hidden\',!agent)">✧ '+tx('مساعد الخريطة','Map assistant')+'</button><button class="pill" onclick="lang=ar()?\'en\':\'ar\';render()">'+tx('English','العربية')+'</button></div></header><div id="view"></div><div class="footer">GeoWatch AI V2 · EXPERIMENTAL DEMO · © OpenStreetMap contributors</div></main></div><div class="agent '+(agent?'':'hidden')+'"><strong>✧ '+tx('مساعد الخريطة التجريبي','Demo map assistant')+'</strong><div class="agentlog" id="log">'+tx('اكتبي: دبي، مقارنة، تقرير، أو عشوائي','Try: Dubai, compare, report, random')+'</div><input id="ask" placeholder="'+tx('اكتبي أمراً...','Enter a command...')+'" onkeydown="if(event.key===\'Enter\')askAgent()"></div>';
document.querySelector('#sidebarTag').textContent=tx('ذكاء جغرافي لاكتشاف التغيرات','Geospatial change intelligence');const v=document.querySelector('#view');
const heading=(h,sub)=>'<h1>'+h+'</h1><p>'+sub+'</p>';
const rows=(ids)=>ids.map(i=>'<button class="row" onclick="selected='+i+';nav(\'compare\')"><span><b>'+name(i)+'</b><small>'+places[i][6]+' · '+(ar()?places[i][3]:places[i][2])+'</small></span><b>'+places[i][7]+'%</b></button>').join('');
const mapbox='<div id="map" class="map"></div>';
if(page==='dashboard'){v.innerHTML='<section class="hero">'+heading(tx('اكتشفي التغيرات قبل أن تقرري مراقبتها','Discover changes before deciding what to monitor'),tx('استكشفي أمثلة توضيحية لتغيرات المباني، قارني قبل وبعد، ثم اختاري المواقع التي تريدين مراقبتها.','Explore illustrative building-change scenarios, compare before and after, then choose locations to watch.'))+'<div class="actions"><button class="btn primary" onclick="nav(\'discover\')">'+tx('استكشاف التغيرات','Explore discoveries')+'</button><button class="btn" onclick="randomPick()">'+tx('موقع عشوائي','Random location')+'</button></div></section><h2>'+tx('كتالوج الاكتشافات','Discovery catalog')+'</h2><div class="grid"><div class="card">'+mapbox+'</div><div class="card">'+rows([0,1,2,3,4])+'</div></div><div class="stats">'+[[places.length,tx('اكتشافات توضيحية','Demo discoveries')],[watched().length,tx('مواقع محفوظة','Saved sites')],[4,tx('دول في العرض','Countries in demo')],[0,tx('نتائج تحليل حقيقية','Real AI detections')]].map(x=>'<div class="stat"><small>'+x[1]+'</small><strong>'+x[0]+'</strong></div>').join('')+'</div>';initMap(filtered)}
else if(page==='discover'){v.innerHTML=heading(tx('اكتشاف التغيرات','Discover changes'),tx('بيانات اصطناعية للعرض وليست اكتشافات حقيقية','Synthetic demo records, not real detections'))+'<div class="toolbar"><input id="search" placeholder="'+tx('ابحثي عن مدينة','Search city')+'" oninput="searchRows()"><select onchange="kind=this.value;render()">'+['all','construction','expansion','demolition','reconstruction'].map(x=>'<option '+(kind===x?'selected':'')+' value="'+x+'">'+x+'</option>').join('')+'</select><button class="btn" onclick="randomPick()">'+tx('موقع عشوائي','Random site')+'</button></div><div class="grid"><div class="card">'+mapbox+'</div><div class="card" id="results">'+rows(filtered)+'</div></div>';initMap(filtered)}
else if(page==='random'){v.innerHTML=heading(tx('استكشفي موقعاً عشوائياً','Explore a random site'),tx('اختيار من أمثلة العرض فقط','A random synthetic demo location'))+'<div class="actions"><button class="btn primary" onclick="randomPick()">'+tx('اختيار موقع عشوائي','Pick random location')+'</button><button class="btn" onclick="nav(\'compare\')">'+tx('عرض قبل وبعد','View before and after')+'</button></div><div class="card section"><h2>'+name(selected)+'</h2>'+mapbox+'</div>';initMap([selected])}
else if(page==='compare'){v.innerHTML=heading(tx('مقارنة قبل وبعد','Before and after comparison'),name(selected)+' · '+places[selected][6])+'<div class="card"><div class="compare"><div class="scene before"><div class="building"></div></div><div class="scene after" id="after"><div class="building"></div></div><input type="range" value="50" min="0" max="100" oninput="document.querySelector(\'#after\').style.clipPath=\'inset(0 \'+(100-this.value)+\'% 0 0)\'"></div><div class="actions"><button class="btn primary" onclick="toggleWatch()">'+tx('حفظ للمراقبة','Save to monitoring')+'</button><button class="btn" onclick="randomPick()">'+tx('اكتشاف آخر','Another discovery')+'</button></div><div class="warning">'+tx('الصور توضيحية وليست صور أقمار صناعية حقيقية','Illustrative graphics, not real satellite imagery')+'</div></div>';document.querySelector('#after').style.clipPath='inset(0 50% 0 0)'}
else if(page==='monitor'){v.innerHTML=heading(tx('مواقع المراقبة','Monitored sites'),tx('المواقع محفوظة في هذا المتصفح فقط','Saved locally in this browser'))+'<div class="card">'+(watched().length?rows(watched()):'<p>'+tx('لا توجد مواقع محفوظة','No saved locations')+'</p>')+'</div>'}
else if(page==='datasets'){v.innerHTML=heading(tx('البيانات التجريبية','Experimental data'),tx('بيانات توضيحية وليست رصداً حقيقياً','Illustrative data, not real monitoring'))+'<div class="card"><p>'+tx('هذه النسخة تعرض أمثلة بيانات اصطناعية. معالجة GeoTIFF تحتاج خدمة منفصلة.','This version uses synthetic examples. GeoTIFF processing requires a separate service.')+'</p><button class="btn primary" onclick="exportCSV()">'+tx('تصدير CSV','Export CSV')+'</button></div>'}
else if(page==='training'){v.innerHTML=heading(tx('مختبر الذكاء الاصطناعي','AI training lab'),tx('واجهة توضيحية فقط — لم يتم تدريب نموذج','Demonstration only — no model trained'))+'<div class="card"><h2>01 · Dataset validation → 02 · Image registration → 03 · Model training → 04 · Evaluation</h2><div class="warning">'+tx('لا توجد خدمة تدريب متصلة','No connected training service')+'</div></div>'}
else if(page==='reports'){v.innerHTML=heading(tx('التقارير','Reports'),tx('تصدير بيانات العرض التجريبية','Export demo records'))+'<div class="card"><button class="btn primary" onclick="exportCSV()">'+tx('تحميل CSV','Download CSV')+'</button></div>'}
else{v.innerHTML=heading(tx('الإعدادات','Settings'),tx('تعمل المنصة مباشرة بدون تسجيل دخول','Direct access — no login'))+'<div class="card"><button class="btn" onclick="lang=ar()?\'en\':\'ar\';render()">'+tx('تغيير اللغة','Change language')+'</button></div>'}}
function initMap(ids){if(!window.maplibregl){document.querySelector('#map').textContent='Map service unavailable';return}map=new maplibregl.Map({container:'map',style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'osm',type:'raster',source:'osm'}]},center:[49.9,25.5],zoom:3.8});map.addControl(new maplibregl.NavigationControl(),'top-left');map.on('load',()=>{ids.forEach(i=>{const p=places[i],el=document.createElement('button');el.style.cssText='width:19px;height:19px;border-radius:50%;background:#1389d5;border:3px solid white;box-shadow:0 2px 6px #3338;cursor:pointer';el.title=name(i);el.onclick=()=>{selected=i;nav('compare')};new maplibregl.Marker({element:el}).setLngLat([p[4],p[5]]).setPopup(new maplibregl.Popup().setText(name(i))).addTo(map)})})}
function randomPick(){selected=Math.floor(Math.random()*places.length);nav('random')}function toggleWatch(){let a=watched();if(!a.includes(selected))a.push(selected);save(a);render()}function searchRows(){const q=document.querySelector('#search').value.toLowerCase();document.querySelector('#results').innerHTML=places.map((p,i)=>i).filter(i=>(kind==='all'||places[i][6]===kind)&&places[i].slice(0,4).join(' ').toLowerCase().includes(q)).map(i=>'<button class="row" onclick="selected='+i+';nav(\'compare\')">'+name(i)+'</button>').join('')}function exportCSV(){const data=[['city','country','longitude','latitude','type','demo_confidence'],...places.map(p=>[p[0],p[2],p[4],p[5],p[6],p[7]])].map(x=>x.join(',')).join('\n');const url=URL.createObjectURL(new Blob([data],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='geowatch-v2-demo.csv';a.click();URL.revokeObjectURL(url)}function askAgent(){const el=document.querySelector('#ask');const q=el.value.toLowerCase();if(q.includes('دبي')||q.includes('dubai')){selected=1;nav('compare')}else if(q.includes('مقارن')||q.includes('compare'))nav('compare');else if(q.includes('تقرير')||q.includes('report'))nav('reports');else if(q.includes('عشوائ')||q.includes('random'))randomPick();else if(q.includes('خريط')||q.includes('map'))nav('discover');else document.querySelector('#log').textContent=tx('جرّبي: دبي، مقارنة، تقرير، عشوائي','Try: Dubai, compare, report, random');el.value=''}render();
</script></body></html>
